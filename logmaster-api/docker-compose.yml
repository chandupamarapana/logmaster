version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: logmaster-mysql
    environment:
      MYSQL_DATABASE: logmaster_db
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  api:
    build: .
    container_name: logmaster-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/logmaster_db?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      - mysql

volumes:
  mysql-data: