# Server
server.port = 8080 

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/logmaster_db?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=chandupa

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# CORS
logmaster.cors.allowed-origins=http://localhost:5173,http://localhost:3000
server.servlet.context-path=/api/v1
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jpa.open-in-view=false
logging.level.org.springframework.security=ERROR